<!doctype html>
<html class="page" lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1440, initial-scale=1.0">
    <title>Coffee House</title>
    <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
    <link href="styles/main.css" rel="stylesheet">
  </head>
  <body class="page__body">
    <header class="page__header header">
      <a class="header__logo header-logo" href="index.html" aria-label="Home">
        <svg class="header-logo__icon" width="100" height="60" aria-hidden="true">
          <use href="images/sprite.svg#logo" />
        </svg>
      </a>

      <nav class="header__nav header-nav">
        <ul class="header-nav__list">
          <li class="header-nav__item">
            <a class="header-nav__link" href="index.html#section-favorite-coffee">Favorite coffee</a>
          </li>
          <li class="header-nav__item">
            <a class="header-nav__link" href="index.html#section-about">About</a>
          </li>
          <li class="header-nav__item">
            <a class="header-nav__link" href="index.html#section-mobile-app">Mobile app</a>
          </li>
          <li class="header-nav__item">
            <a class="header-nav__link" href="index.html#section-contact-us">Contact us</a>
          </li>

          <li class="header-nav__item">
            <a class="header-nav__link header-nav__link--is-active">Menu
              <svg class="header-nav__icon" width="20" height="20" aria-hidden="true">
                <use href="images/sprite.svg#coffee-cup" />
              </svg>
            </a>
          </li>
        </ul>
      </nav>
    </header>

    <main class="page__main">
      <section class="page__menu menu">
        <h1 class="menu__title title title--size-m">Behind each of our cups hides an 
          <i class="title--highlight">amazing surprise</i>
        </h1>
        <ul class="menu__tabs">
          <li class="menu__tab tab">
            <input class="tab__input visually-hidden" type="radio" name="menu-tab" id="menu-tab-coffee" checked>
            <label class="tab__label tab__label--icon-coffee" for="menu-tab-coffee">Coffee</label>
          </li>
          <li class="menu__tab tab">
            <input class="tab__input visually-hidden" type="radio" name="menu-tab" id="menu-tab-tea">
            <label class="tab__label tab__label--icon-tea" for="menu-tab-tea">Tea</label>
          </li>
          <li class="menu__tab tab">
            <input class="tab__input visually-hidden" type="radio" name="menu-tab" id="menu-tab-dessert">
            <label class="tab__label tab__label--icon-dessert" for="menu-tab-dessert">Dessert</label>
          </li>
        </ul>
      </section>
    </main>

    <footer class="page__footer footer" id="section-contact-us">
      <div class="footer__wrapper">
        <div class="footer__col">
          <h2 class="footer__title title title--size-m">Sip, Savor, Smile.
            <i class="title--highlight">It’s coffee time!</i>
          </h2>
          <div class="footer__socials">
            <a class="footer__button button button--theme-icon-light" href="#" title="Twitter" target="_blank">
              <svg class="button__icon" width="24" height="24" aria-hidden="true">
                <use href="images/sprite.svg#twitter" />
              </svg>
            </a>
            <a class="footer__button button button--theme-icon-light" href="#" title="Instagram" target="_blank">
              <svg class="button__icon" width="24" height="24" aria-hidden="true">
                <use href="images/sprite.svg#instagram" />
              </svg>
            </a>
            <a class="footer__button button button--theme-icon-light" href="#" title="Facebook" target="_blank">
              <svg class="button__icon" width="24" height="24" aria-hidden="true">
                <use href="images/sprite.svg#facebook" />
              </svg>
            </a>
          </div>
        </div>
        <div class="footer__col footer-contacts">
          <h3 class="footer-contacts__title">Contact us</h3>
          <div class="footer-contacts__list">
            <a class="footer-contacts__link" href="https://www.google.com/maps/place/GREEN+ROAD+SOLAR/@34.1634632,-118.3166475,14z/data=!4m6!3m5!1s0x80c2c15433e7f6f9:0xddedaf68bfef64a3!8m2!3d34.1681781!4d-118.2956104!16s%2Fg%2F11h_1gchy1?hl=en&entry=ttu" target="_blank">
              <svg class="footer-contacts__icon" width="20" height="20" aria-hidden="true">
                <use href="images/sprite.svg#pin" />
              </svg>
              8558 Green Rd., LA</a>
            <a class="footer-contacts__link" href="tel:+16035550123">
              <svg class="footer-contacts__icon" width="20" height="20" aria-hidden="true">
                <use href="images/sprite.svg#phone" />
              </svg>
              +1 (603) 555-0123</a>
            <p class="footer-contacts__text">
              <svg class="footer-contacts__icon" width="20" height="20" aria-hidden="true">
                <use href="images/sprite.svg#clock" />
              </svg>
              Mon-Sat: 9:00 AM – 23:00 PM</p>
          </div>
        </div>
      </div>
    </footer>
  </body>
</html>
